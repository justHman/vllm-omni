model_type: vieneu
async_chunk: true

stages:
  - stage_id: 0
    model_stage: vieneu_talker
    stage_type: llm
    is_comprehension: true
    input_sources: []
    worker_type: ar
    scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
    runtime:
      devices: "0"
    engine_args:
      max_num_seqs: 10
      model_arch: VieNeuTalkerForConditionalGeneration
      hf_overrides:
        architectures: [VieNeuTalkerForConditionalGeneration]
      enforce_eager: false
      trust_remote_code: true
      async_scheduling: true
      # CRITICAL: tell vLLM to NOT load the checkpoint's generation_config.json.
      # That file ships eos_token_id=[375] (tokenizer EOS) + temperature 0.7 /
      # top_k 20 / top_p 0.8, which vLLM's get_diff_sampling_param merges into
      # the stage-0 sampling defaults and overrides this yaml's
      # default_sampling_params (stop_token_ids=[381], temperature 1.0,
      # top_k 50, max_tokens 2048). Token 375 is masked to -inf by the talker
      # logit mask (only [382,65918) + 381 is sampleable), so with 375 as eos
      # the stop never fires and the talker runs past max_tokens=2048 to
      # ~3270 garbage speech tokens -> 65s of noise.
      #
      # `generation_config: vllm` is a real vLLM EngineArgs field (inherited by
      # OmniEngineArgs), so it survives filter_dataclass_kwargs and is applied
      # inside EngineArgs.create_engine_config() in the WORKER subprocess — not
      # just in the APIServer. This is the key difference from the previous
      # patch_generation_config_if_needed approach, which only patched the
      # APIServer-side model_config and was lost when vllm_config was pickled
      # to the mp-spawned worker (the lambda attribute does not survive
      # pickling, so the worker re-read generation_config.json from disk).
      generation_config: vllm
      # Prefix caching ON for the talker only — it has a KV cache, so caching
      # repeated text/ref-audio prefixes is a net throughput win. Do NOT enable
      # globally: the codec stage (stage 1) has no attention layers, and a
      # global --enable_prefix_caching makes vllm pick HybridKVCacheCoordinator
      # which asserts >1 attention group -> crash on the codec stage.
      enable_prefix_caching: true
      engine_output_type: latent
      gpu_memory_utilization: 0.45
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 512
      max_model_len: 2048
      custom_process_next_stage_input_func: vllm_omni.model_executor.stage_input_processors.vieneu.talker2codec_async_chunk
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 1.0
      top_k: 50
      max_tokens: 2048
      min_tokens: 50
      seed: 42
      detokenize: false
      repetition_penalty: 1.2
      stop_token_ids: [381]

  - stage_id: 1
    model_stage: vieneu_codec
    stage_type: llm
    input_sources: [0]
    worker_type: generation
    scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
    final_output: true
    final_output_type: audio
    runtime:
      devices: "0"
    engine_args:
      max_num_seqs: 1
      model_arch: VieNeuCodecDecoder
      hf_overrides:
        architectures: [VieNeuCodecDecoder]
      enforce_eager: true
      trust_remote_code: true
      async_scheduling: true
      enable_prefix_caching: false
      engine_output_type: audio
      gpu_memory_utilization: 0.08
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 65536
      max_model_len: 65536
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 25

edges:
  - from: 0
    to: 1
    window_size: -1
