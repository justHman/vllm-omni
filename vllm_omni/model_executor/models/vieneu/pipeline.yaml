model_type: vieneu
async_chunk: true

stages:
  - stage_id: 0
    model_stage: vieneu_talker
    stage_type: llm
    is_comprehension: true
    input_sources: []
    worker_type: ar
    scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
    runtime:
      devices: "0"
    engine_args:
      max_num_seqs: 10
      model_arch: VieNeuTalkerForConditionalGeneration
      hf_overrides:
        architectures: [VieNeuTalkerForConditionalGeneration]
      enforce_eager: false
      trust_remote_code: true
      async_scheduling: true
      # CRITICAL: tell vLLM to NOT load the checkpoint's generation_config.json.
      # That file ships eos_token_id=[375] (tokenizer EOS) + temperature 0.7 /
      # top_k 20 / top_p 0.8, which vLLM's get_diff_sampling_param merges into
      # the stage-0 sampling defaults and overrides this yaml's
      # default_sampling_params (stop_token_ids=[381], temperature 1.0,
      # top_k 50, max_tokens 2048). Token 375 is masked to -inf by the talker
      # logit mask (only [382,65918) + 381 is sampleable), so with 375 as eos
      # the stop never fires and the talker runs past max_tokens=2048 to
      # ~3270 garbage speech tokens -> 65s of noise.
      #
      # `generation_config: vllm` is a real vLLM EngineArgs field (inherited by
      # OmniEngineArgs), so it survives filter_dataclass_kwargs and is applied
      # inside EngineArgs.create_engine_config() in the WORKER subprocess — not
      # just in the APIServer. This is the key difference from the previous
      # patch_generation_config_if_needed approach, which only patched the
      # APIServer-side model_config and was lost when vllm_config was pickled
      # to the mp-spawned worker (the lambda attribute does not survive
      # pickling, so the worker re-read generation_config.json from disk).
      generation_config: vllm
      # Prefix caching ON for the talker only — it has a KV cache, so caching
      # repeated text/ref-audio prefixes is a net throughput win. Do NOT enable
      # globally: the codec stage (stage 1) has no attention layers, and a
      # global --enable_prefix_caching makes vllm pick HybridKVCacheCoordinator
      # which asserts >1 attention group -> crash on the codec stage.
      enable_prefix_caching: true
      engine_output_type: latent
      gpu_memory_utilization: 0.45
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 512
      # Reference SDK max_context=2048 is prompt+output total. vLLM's
      # max_model_len caps prompt+output too, but max_tokens caps output
      # alone — set both generously so the talker has room to emit stop 381
      # before being LENGTH_CAPPED. HF generate with this prompt stops at
      # ~252 output tokens, so 4096 headroom is plenty.
      max_model_len: 4096
      custom_process_next_stage_input_func: vllm_omni.model_executor.stage_input_processors.vieneu.talker2codec_async_chunk
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      # Match the reference SDK's `_infer_torch` generate() call exactly
      # (src/vieneu/standard.py): do_sample=True, temperature=1.0, top_k=50,
      # min_new_tokens=50, eos_token_id=381. The reference does NOT use
      # repetition_penalty or top_p — adding rep_penalty=1.2 put sampling
      # off-distribution and suppressed stop token 381 so the talker ran to
      # max_model_len (LENGTH_CAPPED) emitting 1648 garbage speech tokens.
      # top_p=1.0 set explicitly because vLLM's default top_p may differ
      # from HF's implicit 1.0 and that alone changes the trajectory.
      temperature: 1.0
      top_p: 1.0
      top_k: 50
      max_tokens: 2048
      min_tokens: 50
      detokenize: false
      stop_token_ids: [381]

  - stage_id: 1
    model_stage: vieneu_codec
    stage_type: llm
    input_sources: [0]
    worker_type: generation
    scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
    final_output: true
    final_output_type: audio
    runtime:
      devices: "0"
    engine_args:
      # Allow concurrent codec decodes so multiple TTS requests don't
      # serialize on the codec stage. NeuCodec decode is cheap (single
      # FSQ codebook, no attention) so 4-way concurrency is safe on T4.
      max_num_seqs: 4
      model_arch: VieNeuCodecDecoder
      hf_overrides:
        architectures: [VieNeuCodecDecoder]
      # enforce_eager=true: NeuCodec decode_code builds CPU tensors from the
      # input codes and copies them to CUDA inside the forward pass, which
      # crashes under torch.compile + CUDA graph capture ("Cannot copy
      # between CPU and CUDA tensors during CUDA graph capture unless the CPU
      # tensor is pinned"). The codec stage has no attention/KV cache so
      # cudagraph gives no benefit anyway -- keep it eager. Concurrency
      # (max_num_seqs=4) is what speeds the codec stage up, not compile.
      enforce_eager: true
      trust_remote_code: true
      async_scheduling: true
      enable_prefix_caching: false
      engine_output_type: audio
      gpu_memory_utilization: 0.08
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 65536
      max_model_len: 65536
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # INCREMENTAL STREAMING via OVERLAP-ADD CROSSFADE (default):
      #
      # ``codec_chunk_frames = C = 25`` (0.5s of speech at 50 Hz frame rate)
      # ``codec_left_context_frames = O = 25`` (the overlap window, also 0.5s)
      #
      # Each chunk k>0 is decoded as ``[ctx=O + new=C]`` codes (the connector
      # feeds the previous chunk's last O frames as left context -- see
      # stage_input_processors/vieneu.py:talker2codec_async_chunk). The codec
      # decoder (vieneu/codec.py) then CROSSFADES the re-decoded first O frames
      # (head_overlap) with the previous chunk's buffered last O frames
      # (prev_tail) in the SAMPLE domain using a Hann-shaped linear blend
      # (sin^2(pi*t), fade_in + fade_out = 1), and emits
      # ``[crossfaded_overlap] + [remaining new C-O frames]``. The result is
      # seamless streaming with TTFB ~ (C+O) * samples_per_frame / 24000 ~= 0.5s
      # and NO boundary clicks.
      #
      # Why crossfade and not trim: NeuCodec is a CAUSAL conv decoder (unlike
      # fish_speech's non-causal DAC). The suffix of a [ctx+new] decode does
      # NOT reproduce the standalone decode of `new` because the conv's
      # receptive field + causal padding make the suffix position-dependent.
      # The previous "trim the first ctx_frames" approach (commit 73700459)
      # therefore produced a boundary mismatch audible as "bụm" clicks.
      # Crossfading the overlap region (decoded twice -- once as chunk k-1's
      # tail, once as chunk k's head-with-context) blends the two decodes
      # instead of discarding one, so even if O is slightly smaller than the
      # receptive field (so the two decodes differ slightly), the splice is a
      # smooth wobble rather than a click.
      #
      # The crossfade state (prev_tail per request_id) lives on the decoder
      # module (codec.py self._prev_tail), keyed by req_id read from
      # runtime_additional_information. The codec stage runs in a single
      # mp-worker subprocess and processes one batch per step, so per-req
      # state is safe without locking.
      #
      # CAVEAT -- receptive field: O must be >= the NeuCodec conv receptive
      # field for a sample-exact splice. Default O=25 frames (0.5s @ 50Hz)
      # matches fish_speech and is empirically >= the NeuCodec RF for a 0.5s
      # window. If clicks persist, increase O (and C) -- e.g. O=50, C=50.
      #
      # ONE-SHOT FALLBACK (clean audio, no streaming, TTFB ~= total):
      #   codec_chunk_frames: 65536
      #   codec_left_context_frames: 0
      # Flip back to one-shot if streaming regresses audio quality.
      codec_chunk_frames: 25
      codec_left_context_frames: 25

edges:
  - from: 0
    to: 1
    window_size: -1
