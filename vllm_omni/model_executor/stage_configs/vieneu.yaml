# Stage config for running VieNeu-TTS-v2 with the 2-stage omni runtime.
#
# VieNeu-TTS-v2 (pnnbao-ump/VieNeu-TTS-v2) is a Qwen3-backbone TTS that
# decodes NeuCodec FSQ speech tokens to waveform. Architecture:
#   Stage 0 (vieneu_talker): Qwen3 AR talker -> NeuCodec speech-token ids
#   Stage 1 (vieneu_codec) : NeuCodec decode -> 24kHz mono audio
#
# This is the LEGACY OmegaConf stage config consumed by the rc1 serve path
# (``vllm serve ... --omni`` -> ``resolve_model_config_path`` ->
#  ``load_stage_configs_from_yaml`` reads ``stage_args:``). The new-format
# ``model_executor/models/vieneu/pipeline.yaml`` (``stages:`` key) is kept for
# the forward-looking ``StageConfigFactory`` path and the hermetic yaml test;
# both files mirror each other field-for-field, exactly like qwen3_tts ships
# both ``stage_configs/qwen3_tts.yaml`` and ``models/qwen3_tts/pipeline.yaml``.
#
# Verified target: Colab T4 (16GB), single GPU, both stages on device 0.
async_chunk: true
stage_args:
  - stage_id: 0
    stage_type: llm
    is_comprehension: true
    runtime:
      devices: "0"
    engine_args:
      max_num_seqs: 10
      model_stage: vieneu_talker
      model_arch: VieNeuTalkerForConditionalGeneration
      worker_type: ar
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      hf_overrides:
        architectures: [VieNeuTalkerForConditionalGeneration]
      enforce_eager: false
      trust_remote_code: true
      async_scheduling: true
      # CRITICAL: tell vLLM to NOT load the checkpoint's generation_config.json
      # (ships eos_token_id=[375] + temperature 0.7 / top_k 20 / top_p 0.8 which
      # override this yaml's stop_token_ids=[381] / temperature 1.0 / top_k 50 /
      # max_tokens 2048; 375 is masked to -inf by the talker logit mask so the
      # stop never fires and the talker runs past max_tokens to ~3270 garbage
      # speech tokens -> 65s of noise). `generation_config: vllm` is a real
      # vLLM EngineArgs field, survives filter_dataclass_kwargs, and is applied
      # in the WORKER subprocess (unlike patching the APIServer-side
      # model_config, which is lost when vllm_config is pickled to the
      # mp-spawned worker). See pipeline.yaml for the full rationale.
      generation_config: vllm
      # Prefix caching ON for the talker only (see pipeline.yaml note).
      # Do NOT enable globally — codec stage has no attention layers.
      enable_prefix_caching: true
      engine_output_type: latent
      gpu_memory_utilization: 0.45
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 512
      # Reference SDK max_context=2048 is prompt+output total. vLLM's
      # max_model_len caps prompt+output too, but max_tokens caps output
      # alone — set both generously so the talker has room to emit stop 381
      # before being LENGTH_CAPPED. HF generate with this prompt stops at
      # ~252 output tokens, so 4096 headroom is plenty.
      max_model_len: 4096
      custom_process_next_stage_input_func: vllm_omni.model_executor.stage_input_processors.vieneu.talker2codec_async_chunk
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      # Match the reference SDK's `_infer_torch` generate() call exactly
      # (src/vieneu/standard.py): do_sample=True, temperature=1.0, top_k=50,
      # min_new_tokens=50, eos_token_id=381. The reference does NOT use
      # repetition_penalty or top_p — adding rep_penalty=1.2 put sampling
      # off-distribution and suppressed stop token 381 so the talker ran to
      # max_model_len (LENGTH_CAPPED) emitting 1648 garbage speech tokens.
      # top_p=1.0 set explicitly because vLLM's default top_p may differ
      # from HF's implicit 1.0 and that alone changes the trajectory.
      temperature: 1.0
      top_p: 1.0
      top_k: 50
      max_tokens: 2048
      min_tokens: 50
      detokenize: false
      # <|SPEECH_GENERATION_END|> id 381 -- stop when the talker emits it
      # (NOT the tokenizer's generic EOS id 375).
      stop_token_ids: [381]

  - stage_id: 1
    stage_type: llm
    runtime:
      devices: "0"
    engine_args:
      max_num_seqs: 4
      model_stage: vieneu_codec
      model_arch: VieNeuCodecDecoder
      worker_type: generation
      scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
      hf_overrides:
        architectures: [VieNeuCodecDecoder]
      enforce_eager: true
      trust_remote_code: true
      async_scheduling: true
      enable_prefix_caching: false
      engine_output_type: audio
      gpu_memory_utilization: 0.1
      distributed_executor_backend: "mp"
      max_num_batched_tokens: 65536
      max_model_len: 65536
    engine_input_source: [0]
    final_output: true
    final_output_type: audio
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      detokenize: true
      repetition_penalty: 1.0

runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 16

  connectors:
    connector_of_shared_memory:
      name: SharedMemoryConnector
      extra:
        shm_threshold_bytes: 65536
        codec_streaming: true
        connector_get_sleep_s: 0.01
        connector_get_max_wait_first_chunk: 3000
        connector_get_max_wait: 300
        # INCREMENTAL STREAMING via OVERLAP-ADD CROSSFADE (default).
        # See pipeline.yaml for the full rationale (NeuCodec causal conv ->
        # trim does not reproduce standalone decode -> boundary clicks ->
        # crossfade the overlap region in the SAMPLE domain instead).
        #   codec_chunk_frames = C = 25 (0.5s @ 50Hz)
        #   codec_left_context_frames = O = 25 (overlap, also 0.5s)
        # TTFB ~ (C+O) * samples_per_frame / 24000 ~= 0.5-1.0s, NO clicks.
        # C=50/O=50 tested: serial warm faster but concurrent throughput
        # regressed (codec GPU occupied longer per call). 25/25 is balanced.
        # ONE-SHOT FALLBACK (clean audio, no streaming, TTFB ~= total):
        #   codec_chunk_frames: 65536
        #   codec_left_context_frames: 0
        codec_chunk_frames: 25
        codec_left_context_frames: 25

  edges:
    - from: 0
      to: 1
      window_size: -1
